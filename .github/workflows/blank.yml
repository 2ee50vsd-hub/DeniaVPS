name: Ubuntu VPS + Tailscale SSH (6h)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Lý do tạo VPS'
        required: false
        default: 'Remote SSH session'

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 giờ max

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OpenSSH Server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server curl openssl
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart sshd

      - name: Create user & set password
        run: |
          # Tạo user vps
          sudo useradd -m -s /bin/bash vps 2>/dev/null || true
          echo "vps ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/vps > /dev/null
          
          # Lấy password từ secret nếu có, không thì random
          if [ -n "${{ secrets.VPS_PASSWORD }}" ]; then
            PASS="${{ secrets.VPS_PASSWORD }}"
          else
            PASS=$(openssl rand -base64 12)
          fi
          
          echo "vps:${PASS}" | sudo chpasswd
          echo "VPS_USER=vps" >> $GITHUB_ENV
          echo "VPS_PASS=${PASS}" >> $GITHUB_ENV

      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          args: --accept-routes --accept-dns --ssh

      - name: Save Tailscale IP
        run: |
          TS_IP=$(tailscale ip -4)
          echo "TS_IP=${TS_IP}" >> $GITHUB_ENV

      - name: Show connection info
        run: |
          echo "========================================"
          echo "🟢  VPS UBUNTU ĐÃ SẴN SÀNG"
          echo "========================================"
          echo "Tailscale IP : ${{ env.TS_IP }}"
          echo "Username     : ${{ env.VPS_USER }}"
          echo "Password     : ${{ env.VPS_PASS }}"
          echo "----------------------------------------"
          echo "SSH Command  : ssh ${{ env.VPS_USER }}@${{ env.TS_IP }}"
          echo "========================================"
          echo "⏳  Giữ VPS trong 6 giờ..."

      - name: Keep alive (6 hours)
        run: sleep 6h

      - name: Cleanup on exit
        if: always()
        run: echo "🔴 VPS đã tắt. Kết nối bị ngắt."
