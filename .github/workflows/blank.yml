name: Ubuntu VPS with Tailscale (6h)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Lý do tạo VPS'
        required: false
        default: 'Remote dev environment'

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 giờ = 360 phút (max cho runner free)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          args: --accept-routes --accept-dns

      - name: Show connection info
        run: |
          echo "🟢 VPS đã sẵn sàng!"
          echo "Hostname: $(hostname)"
          echo "Tailscale IPv4: $(tailscale ip -4)"
          echo "Tailscale IPv6: $(tailscale ip -6)"
          echo "Public IPv4: $(curl -s ifconfig.me)"
          echo ""
          echo "⏳ Duy trì kết nối trong 6 giờ..."
          echo "Bạn có thể SSH qua Tailscale IP ở trên"

      - name: Keep alive for 6 hours
        run: sleep 6h

      - name: Cleanup
        if: always()
        run: |
          echo "🔴 VPS sẽ tắt sau bước này"
